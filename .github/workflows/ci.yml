name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      APP_ISOLATED_TEST: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore Dependencies
        run: dotnet restore Dev/reCart.slnx
      - name: Build Release (/warnaserror)
        run: dotnet build Dev/reCart.slnx -c Release --no-restore /warnaserror
      - name: Run Isolated Release Tests
        run: dotnet test Dev/reCart.slnx -c Release --no-build --logger "console;verbosity=minimal"
      - name: Build Debug + Automation (/warnaserror)
        run: dotnet build Dev/reCart.slnx -c Debug -p:ReCartTestAutomation=true --no-restore /warnaserror
      - name: Run Isolated Debug + Automation Tests
        run: dotnet test Dev/reCart.slnx -c Debug -p:ReCartTestAutomation=true --no-build --logger "console;verbosity=minimal"
