name: Bug Report
description: Report a defect in reCart (AOT compiler, core hardware, decomp pipeline, host player, or installer)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Please verify you are running legally dumped BYO media locally under `data\rom\` and do **not** attach copyrighted ROMs, disk images, or vendor BIOS files.
  - type: input
    id: version
    attributes:
      label: reCart Version & Host Environment
      placeholder: "e.g., reCart v0.1.0, reEngine v0.5.0, Windows 11 x64"
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Area
      options:
        - AOT Lifter / .recomp Packager
        - Core (CPU / Mappers / PPU / APU)
        - Player / Render Backend (OpenGL / Software)
        - Decomp Pipeline (D0-D5 / Six-Tell)
        - Launcher / Setup Installer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps & Expected vs. Actual Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized Relevant Logs (Remove Any Personal Usernames or Paths)
